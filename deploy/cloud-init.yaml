#cloud-config
# First-boot setup for the MISP VM. deploy.sh fills in the two placeholders.

package_update: true
package_upgrade: true
packages:
  - ufw
  - unattended-upgrades
  - fail2ban

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3

runcmd:
  # Host firewall as a second layer behind the NSG.
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl restart ssh
  # Official MISP 2.5 installer, pinned to a commit.
  - curl -fsSL -o /root/INSTALL.ubuntu2404.sh https://raw.githubusercontent.com/MISP/MISP/__MISP_INSTALLER_REF__/INSTALL/INSTALL.ubuntu2404.sh
  # The installer prints the admin password on screen. Sending its output to a
  # root-only file keeps it out of /var/log/cloud-init-output.log.
  - [bash, -c, "umask 077 && MISP_DOMAIN=__MISP_DOMAIN__ bash /root/INSTALL.ubuntu2404.sh > /root/misp-install.log 2>&1"]
